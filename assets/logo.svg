<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Document icon -->
  <g transform="translate(4, 4)">
    <!-- Page background -->
    <rect x="2" y="0" width="24" height="32" rx="2" fill="white" stroke="#4a9eff" stroke-width="1.5"/>
    <!-- Folded corner -->
    <path d="M20 0 L26 6 L20 6 Z" fill="#e3f0ff" stroke="#4a9eff" stroke-width="1"/>
    <!-- Code lines -->
    <rect x="6" y="10" width="14" height="2" rx="1" fill="#4a9eff"/>
    <rect x="6" y="15" width="10" height="2" rx="1" fill="#93c5fd"/>
    <rect x="6" y="20" width="12" height="2" rx="1" fill="#4a9eff"/>
    <rect x="6" y="25" width="8" height="2" rx="1" fill="#93c5fd"/>
  </g>
  
  <!-- Arrow -->
  <path d="M38 20 L48 20 M45 16 L49 20 L45 24" stroke="url(#bgGradient)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- PDF badge -->
  <g transform="translate(54, 8)">
    <rect x="0" y="0" width="36" height="24" rx="4" fill="url(#bgGradient)"/>
    <text x="18" y="16" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">PDF</text>
  </g>
  
  <!-- nb2pdf text -->
  <text x="95" y="26" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="start">nb2pdf</text>
</svg>
